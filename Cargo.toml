[workspace]
members = ["crates/terminal", "experiments/terminal-replay", "experiments/owned-replay", "experiments/storage-spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/sergiogallegos/nebulax"

[workspace.dependencies]
alacritty_terminal = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
